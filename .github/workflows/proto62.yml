name: proto62-arm-a

# Arm A of purba #62. Three jobs, three grants, one script.
# `permissions:` takes no expression, so the grants cannot be a matrix.
on:
  push:
    branches: ['proto/62-arm-a']
  workflow_dispatch:

jobs:
  none:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - run: .github/proto62-probe.sh
        env: {TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', GRANT: none}

  contents-read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: .github/proto62-probe.sh
        env: {TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', GRANT: contents-read}

  contents-write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: .github/proto62-probe.sh
        env: {TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', GRANT: contents-write}
